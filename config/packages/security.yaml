security:
    # SECURITY (rule 5): Argon2id is set explicitly. In Symfony 7 "auto" picks bcrypt, not Argon2id.
    # Argon2id is memory-hard, which makes GPU/ASIC cracking of leaked hashes expensive.
    # migrate_from: an old bcrypt hash is re-hashed to Argon2id on the next successful login
    # (UserRepository::upgradePassword).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            migrate_from:
                - bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # SECURITY (rule 6): rejects locked accounts before the password check.
            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                # SECURITY (rule 3): login CSRF. A form without a valid token is rejected.
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                default_target_path: app_home
                # SECURITY (rule 12): never redirect to the Referer header after login.
                use_referer: false

            # SECURITY (rule 6): Symfony login throttling. 5 attempts per 15 minutes per IP + email,
            # plus a global limit of 25 attempts per 15 minutes per IP (5 x max_attempts).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: app_logout
                target: app_home
                # SECURITY (rule 3): logout needs a CSRF token, so another site can't log the user out.
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout
                invalidate_session: true

    # SECURITY (rule 5): after login Symfony migrates the session (new session id) to prevent session fixation.
    session_fixation_strategy: migrate

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/(login|register)$, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
