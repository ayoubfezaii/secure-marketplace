# FILE: config/packages/security.yaml
# WHAT: the main security configuration of Symfony.
# ROLE IN THE PROJECT: says how passwords are hashed, how users log in (form + 2FA), how they log out,
#   and which role is needed for each part of the site.
# USED BY: Symfony Security on EVERY request (visitor, buyer, seller, admin).

security:
    # SECURITY (rule 5): Argon2id is set explicitly. In Symfony 7 "auto" picks bcrypt, not Argon2id.
    # Argon2id is memory-hard, which makes GPU/ASIC cracking of leaked hashes expensive.
    # migrate_from: an old bcrypt hash is re-hashed to Argon2id on the next successful login
    # (UserRepository::upgradePassword).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            migrate_from:
                - bcrypt

    # Where users are loaded from: the User entity, found by its email.
    # SECURITY: SQL injection - Doctrine loads the user with a bound parameter.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # A firewall = the security rules for a group of URLs.
    firewalls:
        # Development tools only (profiler, toolbar, assets): no security needed.
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The firewall of the whole site.
        main:
            # lazy: the session is opened only when a page really needs the user.
            lazy: true
            provider: app_user_provider
            # SECURITY (rule 6): rejects locked accounts before the password check.
            user_checker: App\Security\UserChecker

            # Classic login form (email + password) on the route app_login.
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                # SECURITY (rule 3): login CSRF. A form without a valid token is rejected.
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                # SECURITY (rule 12): open redirect protection. The handler only follows internal paths
                # (App\Security\SafeRedirect) and otherwise sends each role to its own dashboard.
                success_handler: App\Security\LoginSuccessHandler
                # SECURITY (rule 12): never redirect to the Referer header after login.
                use_referer: false

            # SECURITY (rule 6): Symfony login throttling. 5 attempts per 15 minutes per IP + email,
            # plus a global limit of 25 attempts per 15 minutes per IP (5 x max_attempts).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # SECURITY (rule 5): optional TOTP second factor (scheb/2fa-bundle). After the password step the user
            # only holds a TwoFactorToken (IS_AUTHENTICATED_2FA_IN_PROGRESS) and can't reach any protected page
            # until a valid code is entered.
            # Routes of the code form and of the code check (provided by scheb/2fa-bundle).
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                # SECURITY (rule 3): CSRF token on the code form.
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: two_factor
                success_handler: App\Security\LoginSuccessHandler

            # Logout: POST on app_logout, then back to the home page.
            logout:
                path: app_logout
                target: app_home
                # SECURITY (rule 3): logout needs a CSRF token, so another site can't log the user out.
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout
                # SECURITY: session hijacking - the session is destroyed at logout, so the old cookie is useless.
                invalidate_session: true

    # SECURITY (rule 5): after login Symfony migrates the session (new session id) to prevent session fixation.
    session_fixation_strategy: migrate

    # SECURITY (rule 4): least privilege. Roles do NOT inherit each other: an admin is not a buyer or a seller
    # (can't buy or sell), a seller is not a buyer. Admin powers on objects (moderation) come from the Voters.
    role_hierarchy:
        ROLE_BUYER: [ROLE_USER]
        ROLE_SELLER: [ROLE_USER]
        ROLE_ADMIN: [ROLE_USER]

    # Note: Only the *first* matching rule is applied
    access_control:
        # Public pages: login, register, logout, password reset. Everything not listed below (home, catalogue) is public too.
        - { path: ^/(login|register)$, roles: PUBLIC_ACCESS }
        # The logout form must work while 2FA is still pending (the "Cancel" button on the code page).
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        # SECURITY (rule 5): the 2FA form is the only page reachable with a half-authenticated session.
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # SECURITY (rule 4): every area is protected by role at the firewall level, as a first layer;
        # controllers add #[IsGranted] and Voters check each object.
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/seller, roles: ROLE_SELLER }
        - { path: ^/buyer, roles: ROLE_BUYER }
        # Buying is reserved to buyers (role matrix, phase R5): sellers and admins can't use the cart or checkout.
        - { path: ^/(cart|checkout|wishlist), roles: ROLE_BUYER }
        # Order pages and account pages: any fully logged-in user (2FA finished). Voters then check each order.
        - { path: ^/orders, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/(account|dashboard), roles: IS_AUTHENTICATED_FULLY }

# Settings used only when the automated tests run.
when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
