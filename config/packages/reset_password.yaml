symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # SECURITY (rule 5): a reset link is valid for 1 hour only and can be used once.
    lifetime: 3600
    # SECURITY (rule 6): at most one reset email per account per 15 minutes (mail-bombing protection).
    # The controller hides this throttle from the client so it doesn't reveal that the account exists.
    throttle_limit: 900
    enable_garbage_collection: true
